<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - Student Skills Exchange</title>
<link rel="stylesheet" href="css/style.css?v=3.0">
<link rel="stylesheet" href="css/messages.css?v=3.0">
</head>
<body>
<nav class="navbar">
    <a href="dashboard.html" class="navbar-brand"><div class="logo-icon">🎓</div> Skills Exchange</a>
    <ul class="navbar-nav">
        <li><a href="dashboard.html" data-page="dashboard">🏠 Dashboard</a></li>
        <li><a href="skills.html"    data-page="skills">⚡ My Skills</a></li>
        <li><a href="search.html"    data-page="search">🔍 Search</a></li>
        <li><a href="requests.html"  data-page="requests">🔄 Requests</a></li>
        <li><a href="messages.html"  data-page="messages">💬 Messages</a></li>
        <li><a href="profile.html"   data-page="profile">👤 Profile</a></li>
    </ul>
    <div class="navbar-user">
        <div class="user-avatar" id="nav-avatar">?</div>
        <span id="nav-user-name"></span>
        <button class="btn-logout" onclick="Auth.logout()">Logout</button>
    </div>
</nav>

<div class="msg-layout">

<!-- ═══ LEFT SIDEBAR ═══ -->
<div class="sidebar">
    <div class="sidebar-top">
        <div class="sidebar-brand">💬 Messages</div>
        <button class="new-chat-fab" onclick="openNewChatModal()" title="New Chat">✎</button>
    </div>
    <div class="sidebar-search">
        <span class="s-icon">🔍</span>
        <input type="text" id="contact-search" placeholder="Search conversations..." oninput="filterContacts()">
    </div>
    <div class="unread-banner" id="unread-banner" style="display:none;">
        <span id="unread-text"></span>
    </div>
    <div class="contacts-scroll" id="contacts-list">
        <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
    <div class="sidebar-footer">
        <div class="sf-avatar" id="sf-avatar"></div>
        <div class="sf-info">
            <div class="sf-name" id="sf-name"></div>
            <div class="sf-status">● Online</div>
        </div>
        <a href="profile.html" class="sf-settings" title="Settings">⚙️</a>
    </div>
</div>

<!-- ═══ MAIN PANEL ═══ -->
<div class="main-panel">
    <div class="no-chat" id="no-chat">
        <div class="no-chat-icon">💬</div>
        <h3>Select a conversation</h3>
        <p>Choose a chat on the left or start a new one</p>
        <button class="btn btn-primary" onclick="openNewChatModal()">+ Start New Chat</button>
    </div>

    <div class="chat-wrapper" id="chat-wrapper" style="display:none; flex-direction:column; height:100%;">

        <!-- Chat Header -->
        <div class="chat-hdr">
            <div class="chat-hdr-left">
                <div class="chat-avatar" id="ch-avatar"></div>
                <div>
                    <div class="chat-hdr-name" id="ch-name"></div>
                    <div class="chat-hdr-status">
                        <span class="status-dot offline" id="status-dot"></span>
                        <span id="status-text">Offline</span>
                    </div>
                </div>
            </div>
            <div class="chat-hdr-actions">
                <button class="hdr-btn active" onclick="showTab('chat')"    id="tab-chat-btn"    title="Chat">💬</button>
                <button class="hdr-btn"        onclick="showTab('content')" id="tab-content-btn" title="Shared Content">📁</button>
            </div>
        </div>

        <!-- ── TAB: CHAT ── -->
        <div id="tab-chat" class="tab-body">
            <div class="chat-msgs" id="chat-msgs"></div>
            <div class="typing-indicator" id="typing-ind" style="display:none;">
                <span id="typing-name"></span> is typing
                <span class="typing-dots"><span></span><span></span><span></span></span>
            </div>
            <div class="chat-input-bar">
                <!-- ✦ Diamond attach button -->
                <button class="attach-btn" onclick="toggleAttachMenu()" title="Attach / Share">&#10022;</button>
                <div class="attach-menu" id="attach-menu" style="display:none;">
                    <button onclick="openShareModal('media')">🎬 Media</button>
                    <button onclick="openShareModal('document')">📄 Document</button>
                    <button onclick="openShareModal('link')">🔗 Link</button>
                </div>

                <!-- 😊 Emoji/GIF/Sticker button -->
                <button class="emoji-btn" onclick="toggleEmojiPanel()" title="Emoji · GIF · Sticker">😊</button>

                <input type="text" id="msg-input" class="msg-input" placeholder="Type a message..."
                       oninput="onTyping()" onkeyup="if(event.key==='Enter')sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>

            <!-- ── Emoji / GIF / Sticker Panel ── -->
            <div class="esp-panel" id="esp-panel" style="display:none;">
                <div class="esp-tabs">
                    <button class="esp-tab active" onclick="switchEspTab('emoji',this)">😊 Emoji</button>
                    <button class="esp-tab"        onclick="switchEspTab('gif',this)">🎞️ GIF</button>
                    <button class="esp-tab"        onclick="switchEspTab('sticker',this)">🎨 Stickers</button>
                </div>

                <!-- Emoji Tab -->
                <div id="esp-emoji" class="esp-body">
                    <input type="text" class="esp-search" id="emoji-search" placeholder="Search emojis…" oninput="filterEmojis()">
                    <div class="esp-cats" id="emoji-cats"></div>
                    <div class="esp-grid" id="emoji-grid"></div>
                    <div class="esp-recent" id="emoji-recent"></div>
                </div>

                <!-- GIF Tab -->
                <div id="esp-gif" class="esp-body" style="display:none;">
                    <input type="text" class="esp-search" id="gif-search" placeholder="Search GIFs… (Tenor)" oninput="searchGIFs()">
                    <div class="gif-grid" id="gif-grid"></div>
                </div>

                <!-- Sticker Tab -->
                <div id="esp-sticker" class="esp-body" style="display:none;">
                    <div class="sticker-packs" id="sticker-packs"></div>
                    <div class="sticker-grid" id="sticker-grid"></div>
                </div>
            </div>
        </div>

        <!-- ── TAB: SHARED CONTENT ── -->
        <div id="tab-content" class="tab-body" style="display:none;">
            <div class="content-tabs">
                <button class="ctab active" onclick="switchContentTab('media',this)">🎬 Media</button>
                <button class="ctab" onclick="switchContentTab('document',this)">📄 Documents</button>
                <button class="ctab" onclick="switchContentTab('link',this)">🔗 Links</button>
            </div>
            <div class="content-list" id="content-list">
                <div class="loading-overlay"><div class="spinner"></div></div>
            </div>
        </div>

    </div>
</div>
</div>

<!-- ═══ NEW CHAT MODAL ═══ -->
<div class="modal-overlay" id="new-chat-modal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
        <h3>✎ Start New Chat</h3>
        <button class="modal-close" onclick="document.getElementById('new-chat-modal').classList.remove('active')">✕</button>
    </div>
    <div class="form-group">
        <label>Select Student</label>
        <select class="form-control" id="new-chat-select"></select>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="startNewChat()">
        Open Chat →
    </button>
  </div>
</div>

<!-- ═══ SHARE CONTENT MODAL ═══ -->
<div class="modal-overlay" id="share-modal">
  <div class="modal" style="max-width:500px;">
    <div class="modal-header">
        <h3 id="share-modal-title">Share Content</h3>
        <button class="modal-close" onclick="closeShareModal()">✕</button>
    </div>
    <div id="share-fields"></div>
    <div id="share-alert"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px;" onclick="submitShare()">
        Share →
    </button>
  </div>
</div>

<script src="js/api.js?v=3.0"></script>
<script src="js/messages.js?v=3.0"></script>
</body>
</html>
